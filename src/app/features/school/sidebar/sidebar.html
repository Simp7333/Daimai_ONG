<!-- Sidebar -->
<aside class="sidebar" role="navigation" aria-label="Menu principal">
  <nav class="menu">
    <a routerLink="/school/dashboard" routerLinkActive="active" class="menu-item" [routerLinkActiveOptions]="{ exact: true }">
      <i class="fa-solid fa-house"></i> Dashboard
    </a>
    <a routerLink="/school/gestion_enfant" routerLinkActive="active" class="menu-item">
      <i class="fa-regular fa-heart"></i> Gestion d'enfants
    </a>
    <a routerLink="/school/suivi_financier" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-eye"></i> Suivi Financier
    </a>
    <a routerLink="/school/rapport" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-chart-bar"></i> Rapport
    </a>
    <a routerLink="/school/parametre" routerLinkActive="active" class="menu-item">
      <i class="fa-solid fa-gear"></i> Paramètres
    </a>
  </nav>

  <div class="share-section">
    <p>Partagez ce lien et changez encore plus de vies !</p>
    <button class="copy-link-button">Copier le lien</button>
  </div>

  <div class="deconnexion">
    <a routerLink="/login" class="menu-item logout-btn">
      <i class="fa-solid fa-right-from-bracket"></i>
      <span>Déconnexion</span>
    </a>
  </div>


</aside>
