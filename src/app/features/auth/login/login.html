<div class="login-page">
  <div class="logo"><img src="assets/images/img.png"></div>
  <div class="login-container">
    <!-- Partie gauche -->
    <div class="form-section">
      <!-- Cercle décoratif -->
      <div class="decoration">
        <div class="circle">
          <i class="fa-solid fa-heart heart-icon"></i>
        </div>
      </div>

      <!-- En-tête -->
      <div class="form-header">
        <h2>Connexion</h2>
        <p>Créez un compte ou connectez-vous pour accéder à la plateforme</p>
      </div>

      <!-- Onglets -->
      <div class="tabs">
        <button class="tab active">Connexion</button>
        <button class="tab">Inscription</button>
      </div>

      <!-- Formulaire -->
      <form class="login-form">
        <div class="form-group">
          <label for="email"><i class="fa-solid fa-envelope"></i> Email</label>
          <input type="email" id="email" placeholder="votremail@gmail.com" />
        </div>
        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Mot de passe</label>
          <input type="password" id="password" placeholder="********" />
        </div>
        <a routerLink="/dashboard"  class="btn-login">Se connecter</a>
      </form>
    </div>

    <!-- Partie droite (image) -->
    <div class="image-section"></div>
  </div>
</div>
