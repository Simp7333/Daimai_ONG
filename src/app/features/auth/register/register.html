<div class="register-page">
  <div class="logo"><img src="assets/images/img.png"></div>
  <!-- Bloc principal -->
  <div class="register-container">

    <!-- Section gauche (formulaire) -->
    <div class="form-section">
      <div class="form-header">
        <h2>Inscription</h2>
        <p>Créez un compte ou connectez-vous pour accéder à la plateforme</p>
      </div>

      <!-- Décoration cercle avec cœur -->
      <div class="decoration">
        <div class="circle">
          <i class="fa-solid fa-heart heart-icon"></i>
        </div>
      </div>

      <!-- Onglets -->
      <div class="tabs">
        <button class="tab active">Connexion</button>
        <button class="tab">Inscription</button>
      </div>

      <!-- Formulaire -->
      <form class="register-form">
        <div class="form-group">
          <label for="nom">Nom</label>
          <input type="text" id="nom" placeholder="Votre nom ...">
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="votremail@gmail.com ...">
        </div>

        <div class="form-group two-cols">
          <div>
            <label for="password">Mot de passe</label>
            <input type="password" id="password" placeholder=".........">
          </div>
          <div>
            <label for="confirm-password">Confirmer le mot de passe</label>
            <input type="password" id="confirm-password" placeholder=".........">
          </div>
        </div>

        <!-- Bouton -->
        <a routerLink="/login" class="btn-register">Créer un compte</a>
      </form>
    </div>

    <!-- Section droite (image) -->
    <div class="image-section"></div>
  </div>
</div>
